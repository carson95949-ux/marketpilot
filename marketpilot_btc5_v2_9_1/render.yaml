services:
  - type: web
    name: marketpilot-btc5
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_production.sh
    healthCheckPath: /health
    envVars:
      - key: MARKETPILOT_DATA_DIR
        value: /var/data
      - key: TRIAL_MINUTES
        value: "30"
      - key: PURCHASE_PRICE_CENTS
        value: "499"
      - key: COOKIE_SECURE
        value: "true"
      - key: MARKETPILOT_SECRET_KEY
        generateValue: true
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_BUSINESS_APPROVED
        value: "false"
      - key: POLYMARKET_BUILDER_API_KEY
        sync: false
      - key: POLYMARKET_BUILDER_SECRET
        sync: false
      - key: POLYMARKET_BUILDER_PASSPHRASE
        sync: false
    disk:
      name: marketpilot-data
      mountPath: /var/data
      sizeGB: 1
